<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>森森天氣</title>
    <link rel="icon" type="image/png" href="./icon-v2.png" />
    <link rel="apple-touch-icon" href="./icon-v2.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icon-v2.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700;900&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --sea-deep: #0b3c5d; /* 深海藍 */
        --sea-light: #3a6f8f; /* 海霧藍 */
        --sand: #f2efe4; /* 沙灘米 */
        --wood: #8b6f47; /* 木頭棕 */
        --wood-dark: #5c472c; /* 深木棕 */
        --glass-white: rgba(255, 255, 255, 0.35); /* 玻璃白 */
        --glass-dark: rgba(0, 0, 0, 0.2);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      body {
        font-family: "Zen Maru Gothic", sans-serif;
        background: linear-gradient(
          to bottom,
          var(--sea-deep),
          var(--sea-light)
        );
        min-height: 100vh;
        color: #fff;
        overflow-x: hidden;
        padding-bottom: 20px;
      }

      /* ====== 頂部 ====== */
      .status-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 15px 20px;
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(8px);
        position: sticky;
        top: 0;
        z-index: 100;
        border-bottom: 1px solid rgba(255, 255, 255, 0.15);
      }

      .location-pill {
        background: var(--wood);
        color: #fff;
        padding: 6px 18px;
        border-radius: 18px;
        font-weight: 700;
        font-size: 1rem;
        border: 1px solid var(--wood-dark);
      }

      .update-pill {
        font-size: 0.8rem;
        color: #dfe6ea;
        background: rgba(255, 255, 255, 0.08);
        padding: 4px 12px;
        border-radius: 12px;
      }

      /* ====== 容器 ====== */
      .container {
        padding: 20px;
        max-width: 600px;
        margin: 0 auto;
      }

      /* ====== Hero card ====== */
      .hero-card {
        background: var(--sand);
        border-radius: 24px;
        padding: 30px 25px;
        text-align: center;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
        border: 3px solid var(--wood-dark);
        margin-bottom: 30px;
        position: relative;
        color: var(--wood-dark);
      }

      .hero-period {
        position: absolute;
        top: -14px;
        left: 50%;
        transform: translateX(-50%);
        background: var(--sea-light);
        color: white;
        padding: 6px 20px;
        border-radius: 16px;
        font-weight: bold;
        border: 2px solid rgba(255, 255, 255, 0.4);
        backdrop-filter: blur(6px);
      }

      .hero-temp-container {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 14px;
        margin: 20px 0;
      }

      .hero-icon {
        font-size: 4.5rem;
      }

      .hero-temp {
        font-size: 4rem;
        font-weight: 900;
        color: var(--wood-dark);
      }

      .hero-desc {
        font-size: 1.3rem;
        margin-bottom: 20px;
        font-weight: bold;
        color: var(--wood);
      }

      /* ====== 建議區塊 ====== */
      .advice-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
        margin-top: 15px;
        padding-top: 20px;
        border-top: 1px solid rgba(0, 0, 0, 0.15);
      }

      .advice-item {
        background: rgba(255, 255, 255, 0.5);
        border: 1px solid var(--wood);
        border-radius: 16px;
        padding: 12px;
        color: var(--wood-dark);
      }

      .advice-icon {
        font-size: 2rem;
      }

      .advice-text {
        font-size: 1.1rem;
        font-weight: 700;
        margin-top: 5px;
      }

      /* ====== 稍後預報 ====== */
      .section-title {
        font-size: 1.2rem;
        color: #e8f1f5;
        margin-bottom: 15px;
        margin-left: 10px;
        font-weight: 800;
      }

      .scroll-container {
        display: flex;
        overflow-x: auto;
        gap: 15px;
        padding-bottom: 10px;
        scrollbar-width: none;
      }
      .scroll-container::-webkit-scrollbar {
        display: none;
      }

      .mini-card {
        min-width: 140px;
        background: rgba(255, 255, 255, 0.38);
        border: 2px solid var(--wood);
        border-radius: 20px;
        padding: 15px;
        text-align: center;
        flex-shrink: 0;
        backdrop-filter: blur(4px);
      }

      .mini-time {
        background: var(--sea-light);
        color: white;
        padding: 4px 10px;
        border-radius: 12px;
        font-size: 0.8rem;
        margin-bottom: 10px;
      }

      .mini-icon {
        font-size: 2.2rem;
        margin: 8px 0;
      }

      .mini-temp {
        font-size: 1.1rem;
        font-weight: 700;
        color: var(--wood-dark);
      }

      /* ====== Loading ====== */
      .loading-screen {
        position: fixed;
        inset: 0;
        background: var(--sea-deep);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 999;
      }
    </style>
  </head>

  <body>
    <div id="loading" class="loading-screen">
      <div style="font-size: 4rem; animation: bounce 2s infinite">☁️</div>
      <p style="color: white; font-weight: bold; margin-top: 20px">
        正在觀測雲的流動...
      </p>
    </div>
    <div class="status-bar">
      <div class="location-pill">📍臺東縣</div>
      <div id="updateTime" class="update-pill">更新中...</div>
    </div>

    <div class="container" id="mainContent" style="display: none">
      <div id="heroCard"></div>

      <h3 class="section-title">稍後預報</h3>
      <div class="scroll-container" id="futureForecasts"></div>
    </div>

    <script>
      const API_URL = "https://weatheoftoday.zeabur.app/api/weather/kaohsiung";

      function getWeatherIcon(weather) {
        if (!weather) return "🌤️";
        if (weather.includes("晴")) return "☀️";
        if (weather.includes("多雲")) return "⛅";
        if (weather.includes("陰")) return "☁️";
        if (weather.includes("雨")) return "🌧️";
        if (weather.includes("雷")) return "⛈️";
        return "🌤️";
      }

      function getAdvice(rainProb, maxTemp) {
        let rainIcon = "🌂";
        let rainText = "不用帶傘";
        if (parseInt(rainProb) > 30) {
          rainIcon = "☂️";
          rainText = "記得帶傘！";
        }

        let clothIcon = "👕";
        let clothText = "舒適穿搭";
        if (parseInt(maxTemp) >= 28) {
          clothIcon = "🎽";
          clothText = "短袖出發";
        } else if (parseInt(maxTemp) <= 20) {
          clothIcon = "👘";
          clothText = "加件外套";
        }

        return { rainIcon, rainText, clothIcon, clothText };
      }

      function getTimePeriod(startTime) {
        const hour = new Date(startTime).getHours();
        if (hour >= 5 && hour < 11) return "🌞早晨";
        if (hour >= 11 && hour < 14) return "🌭中午";
        if (hour >= 14 && hour < 18) return "☕下午";
        if (hour >= 18 && hour < 23) return "🌙晚上";
        return "🌚深夜";
      }

      function renderWeather(data) {
        const forecasts = data.forecasts;
        const current = forecasts[0];
        const others = forecasts.slice(1);

        // 1. 渲染 Hero Card (主畫面)
        const advice = getAdvice(current.rain, current.maxTemp);
        const period = getTimePeriod(current.startTime);
        const avgTemp = Math.round(
          (parseInt(current.maxTemp) + parseInt(current.minTemp)) / 2
        );

        document.getElementById("heroCard").innerHTML = `
                        <div class="hero-card">
                            <div class="hero-period">${period}</div>
                            <div class="hero-temp-container">
                                <div class="hero-icon">${getWeatherIcon(
                                  current.weather
                                )}</div>
                                <div class="hero-temp">${avgTemp}°</div>
                            </div>
                            <div class="hero-desc">${current.weather}</div>
                            
                            <div class="advice-grid">
                                <div class="advice-item">
                                    <div class="advice-icon">${
                                      advice.rainIcon
                                    }</div>
                                    <div class="advice-text">${
                                      advice.rainText
                                    }</div>
                                    <div style="font-size:0.7rem; color:#999">降雨率 ${
                                      current.rain
                                    }</div>
                                </div>
                                <div class="advice-item">
                                    <div class="advice-icon">${
                                      advice.clothIcon
                                    }</div>
                                    <div class="advice-text">${
                                      advice.clothText
                                    }</div>
                                    <div style="font-size:0.7rem; color:#999">最高溫 ${
                                      current.maxTemp
                                    }°</div>
                                </div>
                            </div>
                        </div>
                    `;

        // 2. 渲染稍後預報 (包含明天判斷)
        const scrollContainer = document.getElementById("futureForecasts");
        scrollContainer.innerHTML = "";

        // 抓今天的日期數字 (例如 24)
        const todayDate = new Date().getDate();

        others.forEach((f) => {
          let p = getTimePeriod(f.startTime);

          // 判斷該預報的日期是否跟今天不同，不同就是明天
          const fDate = new Date(f.startTime);
          if (fDate.getDate() !== todayDate) {
            p = "明天" + p;
          } else {
            p = "今天" + p;
          }

          scrollContainer.innerHTML += `
                            <div class="mini-card">
                                <div class="mini-time">${p}</div>
                                <div class="mini-icon">${getWeatherIcon(
                                  f.weather
                                )}</div>
                                <div class="mini-temp">${f.minTemp}° - ${
            f.maxTemp
          }°</div>
                                <div style="font-size:0.8rem; color:#706c6c; margin-top:5px;">💧${
                                  f.rain
                                }</div>
                            </div>
                        `;
        });

        // 3. 右上角顯示今日日期
        const now = new Date();
        const month = now.getMonth() + 1;
        const date = now.getDate();
        const dayIndex = now.getDay();
        const days = ["週日", "週一", "週二", "週三", "週四", "週五", "週六"];

        document.getElementById(
          "updateTime"
        ).textContent = `${month}月${date}日 ${days[dayIndex]}`;
      }

      async function fetchWeather() {
        try {
          // 1. 定義「最低等待時間」：1500 毫秒 (1.5秒)
          const delayPromise = new Promise((resolve) =>
            setTimeout(resolve, 1500)
          );

          // 2. 定義「抓取資料」的工作
          const fetchPromise = fetch(API_URL).then((res) => res.json());

          // 3. Promise.all 會等待「兩個都完成」才會往下走
          // result 陣列裡，第一個是 delay 的結果(沒用到)，第二個是 api 的 json 資料
          const [_, json] = await Promise.all([delayPromise, fetchPromise]);

          if (json.success) {
            renderWeather(json.data);

            // 資料處理好後，隱藏 Loading，顯示主畫面
            document.getElementById("loading").style.display = "none";
            document.getElementById("mainContent").style.display = "block";
          } else {
            throw new Error("API Error");
          }
        } catch (e) {
          console.error(e);
          alert("天氣資料讀取失敗，狸克把網路線咬斷了！");
        }
      }

      document.addEventListener("DOMContentLoaded", fetchWeather);
    </script>
  </body>
</html>
